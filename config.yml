# Emulator configuration.
#
# Schema (consumed by Orchestrator.DynamicAnalyser via cfg[arch][bits]):
#
#   <arch>:            canonical arch key (see utils.ARCH_ALIASES)
#     <bits>:          integer, 32 or 64
#       path:    directory holding the images
#       kernel:  guest kernel to boot
#       image:   rootfs image copied per-run and booted
#       dtb:     device tree blob (arch-dependent, optional)
#       cmd:     QEMU command line; "{image}" is substituted with the
#                per-run copy of the rootfs at launch time.
#
# Only arm/32 is fully provisioned below; the others are placeholders with
# the correct shape so adding an image is a drop-in change.

arm:
  32:
    path: /home/user/QImages/arm_versatile/
    kernel: /home/user/QImages/arm_versatile/zImage
    image: /home/user/QImages/arm_versatile/rootfs.ext2
    dtb: /home/user/QImages/arm_versatile/versatile-pb.dtb
    cmd: qemu-system-arm -M versatilepb -kernel /home/user/QImages/arm_versatile/zImage -dtb /home/user/QImages/arm_versatile/versatile-pb.dtb -drive file={image},if=scsi,format=raw -append "rootwait root=/dev/sda console=ttyAMA0,115200" -serial stdio -netdev tap,id=intnet,ifname=tap0,script=no,downscript=no -device rtl8139,netdev=intnet,mac=52:54:00:00:EE:03

aarch64:
  64:
    path: /home/user/QImages/aarch64_virt
    kernel: /home/user/QImages/aarch64_virt/Image
    image:
    dtb:
    cmd: qemu-system-aarch64 -M virt -cpu cortex-a53 -nographic -smp 1 -kernel /home/user/QImages/aarch64_virt/Image -append "rootwait root=/dev/vda console=ttyAMA0" -netdev tap,id=intnet,ifname=tap0,script=no,downscript=no -device virtio-net-device,netdev=intnet -drive file={image},if=none,format=raw,id=hd0 -device virtio-blk-device,drive=hd0

mips:
  32:
    path: /home/user/QImages/mips_malta/
    kernel:
    image:
    dtb:
    cmd:

x86:
  32:
    path: /home/user/QImages/x86/
    kernel:
    image:
    dtb:
    cmd:

x86_64:
  64:
    path: /home/user/QImages/x86_64/
    kernel:
    image:
    dtb:
    cmd:

ppc64:
  64:
    path: /home/user/QImages/ppc64_pseries/
    kernel:
    image:
    dtb:
    cmd:

tmp: /tmp/
schema_path: Report/

# Stealth settings — keep instrumentation invisible to the sample (see STEALTH.md).
stealth:
  enabled: true
  # Host-side TAP the guest NIC is attached to; network is captured here, not
  # inside the guest. Must match ifname= in the arch cmd above.
  capture_iface: tap0
  # Syscall tracing backend:
  #   auditd      - in-guest auditd/ausearch (works today, but visible to the
  #                 sample); the guest image must ship auditd.
  #   qemu-plugin - host-side QEMU TCG plugin, invisible to the guest
  #                 (requires a plugins-enabled QEMU build; see tracing/).
  #                 Produces plugin_trace_summary.json (flat behavioral summary);
  #                 full per-process report parity is still in progress.
  syscall_backend: auditd
  # Path to the compiled TCG plugin, used only when syscall_backend==qemu-plugin.
  plugin_so: tracing/libsyscall_trace.so
  # Fingerprint pools (optional; sensible defaults live in stealth.py).
  mac_oui_pool: ["B8:27:EB", "DC:A6:32", "00:1D:0F", "00:E0:4C", "00:14:6C"]
  hostname_pool: ["router", "gateway", "dvr", "ipcam", "nas"]
  sample_name_pool: ["update", "cfgd", "sysinit", "watchdog", "udhcpc"]
  sample_dir_pool: ["/tmp", "/var/tmp", "/var/run"]
