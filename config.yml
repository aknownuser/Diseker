mips:
  kernel: /media/pc/Shared/Images/vmlinux-3.2.0-4-4kc-malta
  image: /media/pc/Shared/Images/debian_wheezy_mips_standard.qcow2
  pass:
  host:
  port:
  cmd: qemu-system-arm -M versatilepb -kernel /home/user/QImages/arm_testing/zImage -dtb /home/user/QImages/arm_testing/versatile-pb.dtb -drive file={image},if=scsi,format=raw -append "rootwait root=/dev/sda console=ttyAMA0,115200" -serial stdio -netdev tap,id=intnet,ifname=tap0,script=no,downscript=no -device rtl8139,netdev=intnet,mac=52:54:00:00:EE:03

arm:
  32:
    path: /home/user/QImages/arm_versatile/
    kernel: /home/user/QImages/arm_versatile/zImage
    image: /home/user/QImages/arm_versatile/rootfs.ext2
    dtb: /home/user/QImages/arm_versatile/versatile-pb.dtb
    cmd: qemu-system-arm -M versatilepb -kernel /home/user/QImages/arm_versatile/zImage -dtb /home/user/QImages/arm_versatile/versatile-pb.dtb -drive file={image},if=scsi,format=raw -append "rootwait root=/dev/sda console=ttyAMA0,115200" -serial stdio -netdev tap,id=intnet,ifname=tap0,script=no,downscript=no -device rtl8139,netdev=intnet,mac=52:54:00:00:EE:03

aarch:
  64:
    path: /home/user/QImages/aarch64_virt
    kernel: /home/user/QImages/aarch64_virt/Image
    image: /home/user/QImages/aarch64_virt
    cmd: qemu-system-aarch64 -M virt -cpu cortex-a53 -nographic -smp 1 -kernel output/images/Image -append "rootwait root=/dev/vda console=ttyAMA0" -netdev user,id=eth0 -device virtio-net-device,netdev=eth0 -drive file=rootfs.ext4,if=none,format=raw,id=hd0 -device virtio-blk-device,drive=hd0

